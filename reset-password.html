<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://oalnswbnjhkkovxjxtlz.supabase.co wss://oalnswbnjhkkovxjxtlz.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer"><title>Thiết lập mật khẩu | Điểm danh LHTech</title>
  <link rel="stylesheet" href="css/app.css?v=20261031-recovery">
  <script defer src="vendor/supabase-2.118.0.js"></script><script defer src="js/config.js"></script><script defer src="js/auth.js?v=20261102-password1"></script><script defer src="js/reset-password.js?v=20261102-password1"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">LH</span><span>Điểm danh LHTech</span></a></header>
  <main class="workspace account-workspace">
    <section class="panel account-panel" aria-labelledby="reset-title">
      <h1 id="reset-title">Thiết lập mật khẩu</h1>
      <p id="reset-status" class="status" role="status" aria-live="polite">Đang kiểm tra liên kết…</p>
      <div id="recovery-request" hidden>
        <p class="muted">Nhận liên kết xác nhận qua email để tạo mật khẩu đầu tiên hoặc đặt lại mật khẩu.</p>
        <form id="recovery-form" class="reset-form" method="post">
          <div><label for="recovery-email">Email tài khoản</label><input id="recovery-email" name="email" type="email" autocomplete="username" maxlength="254" required></div>
          <button id="send-recovery" class="primary wide" type="submit" disabled>Gửi liên kết qua email</button>
        </form>
      </div>
      <form id="password-form" class="reset-form" method="post" hidden>
        <p id="verified-email" class="muted"></p>
        <div><label for="new-password">Mật khẩu mới</label><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="password-hint"></div>
        <div><label for="confirm-password">Nhập lại mật khẩu mới</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
        <p id="password-hint" class="help">Dùng từ 10 đến 128 ký tự.</p>
        <button id="save-password" class="primary wide" type="submit">Lưu mật khẩu</button>
      </form>
      <p class="help"><a href="index.html">Quay lại đăng nhập</a></p>
      <noscript><p>Bạn cần bật JavaScript để thiết lập mật khẩu.</p></noscript>
    </section>
  </main>
</body>
</html>
