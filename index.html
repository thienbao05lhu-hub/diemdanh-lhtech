<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="referrer" content="no-referrer">
  <title>Đăng nhập | Điểm danh LHTech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
  <script defer src="js/auth-callback.js"></script>
  <script defer src="vendor/supabase-2.118.0.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js?v=20261031_09"></script>
  <script defer src="js/login.js?v=20261031_09"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">
  <main class="w-full max-w-md">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden backdrop-blur-md">
      <!-- Glow background effect -->
      <div class="absolute -top-16 -right-16 w-36 h-36 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 mx-auto flex items-center justify-center text-white shadow-xl shadow-emerald-500/20 mb-3 text-2xl">
          <i class="fa-solid fa-qrcode"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Hệ Thống LHTech</h1>
        <p class="text-xs text-slate-400 mt-1">Đăng nhập tài khoản Quản trị & Điểm danh</p>
      </div>

      <!-- Form Đăng nhập -->
      <form id="login-form" method="post" class="space-y-4">
        <div>
          <label for="email" class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Email hoặc Mã Sinh Viên
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i class="fa-solid fa-envelope text-xs"></i>
            </span>
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              maxlength="254"
              required
              placeholder="VD: 123000896 hoặc 123000896@student.lhu.edu.vn"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Mật khẩu
          </label>
          <div class="relative flex items-center bg-slate-950 border border-slate-800 rounded-xl focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition">
            <span class="pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="1024"
              required
              placeholder="Nhập mật khẩu..."
              class="w-full bg-transparent border-0 pl-3 pr-2 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none"
            >
            <button
              id="show-password"
              type="button"
              class="px-3 text-xs text-slate-400 hover:text-white transition"
              aria-pressed="false"
              aria-controls="password"
            >
              Hiện
            </button>
          </div>
        </div>

        <button
          id="login-button"
          type="submit"
          disabled
          class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Đăng nhập</span>
        </button>
      </form>

      <p id="login-status" class="status text-xs text-center mt-3 empty:hidden text-amber-400" role="status" aria-live="polite">
        Đang khởi tạo…
      </p>
      <button id="retry-session" type="button" class="hidden w-full mt-2 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">
        Kiểm tra lại phiên
      </button>

      <div class="mt-6 pt-4 border-t border-slate-800 text-center space-y-1.5 text-xs text-slate-500">
        <p><a href="reset-password.html" class="text-emerald-400 hover:text-emerald-300 transition">Thiết lập hoặc đặt lại mật khẩu</a></p>
        <p>Cần cấp tài khoản? Liên hệ quản trị viên của xưởng.</p>
      </div>

      <noscript><p class="text-rose-400 text-xs text-center mt-3">Bạn cần bật JavaScript để đăng nhập.</p></noscript>
    </div>
  </main>
</body>
</html>
